org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle 在应用插件时会连 maven.minecraftforge.net / libraries.minecraft.net 做环境检查；
# 网络不通时每次构建都会卡若干分钟。设为 false 跳过该检查（依赖已缓存的机器上建议保留）。
systemProp.net.minecraftforge.gradle.check.certs=false

# Minecraft / Forge versions
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)
mappings_channel=official
mappings_version=1.20.1

# Mod identity
mod_id=ftyupater
mod_name=FTYUpater
mod_license=MIT
mod_version=2.0.0
mod_authors=fty
mod_description=Simple Modpack Sync - a dedicated sync folder served over HTTP with hash verification and full mirror client sync.
mod_credits=
mod_issueTrackerURL=

# ===== POM / metadata for javadocs and sources =====
group=com.ftysync
archives_base_name=FTYUpater