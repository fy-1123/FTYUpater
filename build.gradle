plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'

    // MixinGradle：为 Mixin 注解处理器提供 ForgeGradle 的映射并生成 refmap。
    // 缺了它，dev 用 official 名写的 @Inject 在正式 jar（SRG 名）里找不到目标。
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = group

base {
    archivesName = archives_base_name
}

// Compile with the available JDK (currently 21) but target Java 17 bytecode/API,
// which is what Minecraft 1.20.1 requires.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    copyIdeResources = true

    runs {
        configureEach {
            // dev 下 mod 是目录而不是 jar，Mixin 无法从 MANIFEST 的 MixinConfigs 发现配置，
            // 必须用启动参数显式声明；正式 jar 仍由 MANIFEST 承担，两条路互不影响。
            args '--mixin.config=ftyupater.mixins.json'
        }

        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            // Comma-separated list of namespaces to load gametests from
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mixin refmap：源码里用 official 名书写 @Inject/@At 目标，注解处理器在编译期把
// official 名映射成 SRG 并写出 ftyupater.refmap.json 打进 jar；否则生产环境里
// Mixin 解析不到注入目标（dev 运行则由 --mixin.config + 运行时映射处理）。
mixin {
    add sourceSets.main, "ftyupater.refmap.json"
}

repositories {
    // For any dependency / plugin that might need to be resolved from maven central
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Generates ftyupater.refmap.json, without which the join hook could not be resolved to the
    // obfuscated (SRG) method name in a released game.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 纯 JVM 单元测试（core/ 不依赖 Minecraft 类）。
    // 注意：不依赖 junit-jupiter 聚合件（本地缓存里只有拆分后的 api/engine），可离线构建。
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('processResources').configure {
    // expand 默认按平台编码（Windows 为 GBK）读写，会损坏 UTF-8 中文；显式指定 UTF-8。
    filteringCharset = 'UTF-8'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "ftyupater.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}